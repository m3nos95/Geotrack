<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSA Trak — DelDOT Professional Services</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect fill='%230d1320' width='64' height='64' rx='10'/><text x='32' y='42' text-anchor='middle' font-size='28' fill='%23e09848' font-family='sans-serif' font-weight='700'>P</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1320;
      --surface: #162035;
      --panel: #1c2a46;
      --panel2: #223352;
      --border: #273550;
      --accent: #c47c2a;
      --accent2: #e09848;
      --gold: #dba040;
      --green: #1a6644;
      --green2: #2ecc78;
      --red: #8b2020;
      --red2: #e05555;
      --blue: #2560a8;
      --blue2: #4a90e2;
      --text: #e2ecf8;
      --muted: #8a9bb0;
      --mute2: #526078;
      --mono: "DM Mono", ui-monospace, monospace;
      --sans: Inter, system-ui, sans-serif;
      --display: "Roboto Condensed", Inter, sans-serif;
      --radius: 10px;
      --shadow: 0 8px 28px rgba(0,0,0,.4);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent2); }

    .app { display: flex; flex-direction: column; min-height: 100%; }
    header.top {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 16px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 40;
    }
    .brand { font-family: var(--display); letter-spacing: .12em; color: var(--accent2); font-size: 20px; font-weight: 700; }
    .brand small { display: block; font-family: var(--sans); letter-spacing: 0; color: var(--muted); font-size: 11px; font-weight: 500; }
    .contract-switch { display: flex; gap: 6px; flex-wrap: wrap; }
    .cbtn {
      border: 1px solid var(--border); background: var(--panel);
      border-radius: 999px; padding: 6px 12px; color: var(--muted);
    }
    .cbtn.on { background: #2a3d22; border-color: var(--green2); color: #d8ffe8; }
    .cbtn.hist { opacity: .9; }
    .cbtn.hist.on { background: #3a2e16; border-color: var(--accent2); color: #ffe9c4; }
    .spacer { flex: 1; }
    .top-actions { display: flex; gap: 8px; }
    .btn {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px; color: var(--text);
    }
    .btn:hover { border-color: var(--accent2); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1208; font-weight: 600; }
    .btn.good { background: var(--green); border-color: #2a8a5c; }
    .btn.danger { background: var(--red); border-color: #a33; }
    .btn.ghost { background: transparent; }
    .btn.small { padding: 4px 8px; font-size: 12px; }

    .kpis {
      display: grid; grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 10px; padding: 12px 16px;
    }
    .kpi {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 12px;
    }
    .kpi .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .kpi .val { font-family: var(--mono); font-size: 16px; margin-top: 4px; }
    .kpi .sub { font-size: 11px; color: var(--mute2); margin-top: 2px; }
    .kpi.warn .val { color: var(--accent2); }
    .kpi.bad .val { color: var(--red2); }
    .kpi.ok .val { color: var(--green2); }

    .workspace { display: grid; grid-template-columns: 220px 1fr; gap: 0; flex: 1; min-height: 0; }
    aside.tasks {
      border-right: 1px solid var(--border); background: #121a2b;
      padding: 12px; overflow: auto;
    }
    aside.tasks h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .task-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: pointer;
    }
    .task-card.on { border-color: var(--accent2); background: #2a2418; }
    .task-card .n { font-weight: 600; }
    .task-card .m { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .bar { height: 4px; background: #0d1320; border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--accent2); }

    main.stage { padding: 12px 16px 40px; overflow: auto; }
    .row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
    .tabs { display: flex; gap: 4px; }
    .tab {
      border: 1px solid transparent; background: transparent;
      color: var(--muted); padding: 6px 10px; border-radius: 8px;
    }
    .tab.on { background: var(--panel); border-color: var(--border); color: var(--text); }

    table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.grid th {
      position: sticky; top: 0; background: #1a2740; z-index: 2;
      text-align: left; font-size: 11px; color: var(--muted); font-weight: 600;
      padding: 8px; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    table.grid td { padding: 7px 8px; border-bottom: 1px solid #223049; vertical-align: top; }
    table.grid tr:hover td { background: #1a2740; }
    table.grid tr.sel td { background: #2a2418; }
    table.grid .num { font-family: var(--mono); text-align: right; white-space: nowrap; }
    table.grid .muted { color: var(--muted); }

    .pill {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 999px; letter-spacing: .03em;
    }
    .st-draft { background: #243044; color: #9bb; }
    .st-proposal, .st-revision { background: #3a2e16; color: #ffd089; }
    .st-approved, .st-ntp { background: #16344e; color: #9fd4ff; }
    .st-invoicing { background: #163a28; color: #b6f0c9; }
    .st-spent { background: #1d2a22; color: #8cba9a; }
    .st-closed { background: #2a2f3a; color: #aab; }
    .st-canceled { background: #3a1818; color: #ffb3b3; }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
    }
    .card h2 { margin: 0 0 10px; font-size: 16px; font-family: var(--display); letter-spacing: .04em; }
    .card h3 { margin: 0 0 8px; font-size: 13px; color: var(--accent2); }
    .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    label.f { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
    label.f input, label.f select, label.f textarea {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 8px;
    }
    label.f textarea { min-height: 70px; resize: vertical; }
    .banner {
      background: #2a2418; border: 1px solid #5a4318; color: #f0d7a0;
      border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px;
    }
    .banner.info { background: #16283c; border-color: #2a5a86; color: #c5e2ff; }
    .checks { display: flex; flex-direction: column; gap: 6px; }
    .check {
      display: grid; grid-template-columns: 88px 1fr; gap: 10px;
      padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel);
    }
    .check .s { font-size: 11px; font-weight: 700; text-transform: uppercase; padding-top: 2px; }
    .pass { color: var(--green2); }
    .fail { color: var(--red2); }
    .warn { color: var(--accent2); }
    .na { color: var(--mute2); }
    .toast {
      position: fixed; bottom: 16px; right: 16px; background: #123; border: 1px solid var(--accent2);
      padding: 10px 14px; border-radius: 8px; z-index: 80; display: none;
    }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 70;
      display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto;
    }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; width: min(720px, 100%); box-shadow: var(--shadow); }

    .print-only { display: none; }
    @media print {
      body { background: #fff; color: #111; }
      header.top, aside.tasks, .kpis, .no-print, .toast { display: none !important; }
      .workspace { display: block; }
      main.stage { padding: 0; }
      .print-only { display: block; }
      .card, table.grid th { background: #fff; color: #111; border-color: #ccc; }
      a { color: #111; text-decoration: none; }
    }
    @media (max-width: 980px) {
      .workspace { grid-template-columns: 1fr; }
      aside.tasks { border-right: 0; border-bottom: 1px solid var(--border); }
      .kpis { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="psa-engine.js"></script>
  <script src="psa-catalog.js"></script>
  <script src="psa-seed.js"></script>
  <script src="psa-app.js"></script>
</body>
</html>
